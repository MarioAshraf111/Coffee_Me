
<!DOCTYPE html>

    <style>
        body {
            background-image: url("40/background2.jpg");
        }

        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            padding: 20px;
            margin-left: 270px;
            gap: 10px;
            justify-content: center;
        }

            .image-container figure:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            }

        .figcaption:hover {
            background-color: #000000;
        }

        .image-container figure {
            text-align: center;
            width: 200px;
        }

        .image-container img {
            width: 100%;
            height: auto;
        }

        .image-container figcaption {
            margin-top: 20px;
            font-size: 20px;
            color: #555;
            color: #ffffff;
            background-color: rgba(128, 128, 128, 0.689);
            border-radius: 5px;
            padding: 10px;
        }

        .image-container figure button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #5e83228c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sidebar {
            width: 250px;
            background-color: #bab8b479;
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(220, 204, 135, 0.1);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

            .sidebar h2 {
                text-align: center;
                font-family: allura;
            }

            .sidebar a {
                display: block;
                color: white;
                text-decoration: none;
                margin: 15px 0;
                padding: 10px;
                background-color: #626364;
                border-radius: 5px;
                transition: background-color 0.3s ease;
            }

                .sidebar a:hover {
                    background-color: #edd4a5ac;
                }

                .sidebar a.selected {
                    background-color: #bbc89cac;
                    border-bottom: 3px solid #ffffff;
                }
    </style>
    <style>

        #welcomeText {
            font-size: 24px;
            text-align: center;
            color: rgb(4 4 4 / 80%);
            margin: 50px auto;
            overflow: hidden;
            white-space: nowrap;
            animation: slideText 5s linear forwards;
        }


        @keyframes slideText {
            0% {
                width: 0;
                opacity: 1;
            }

            100% {
                width: 100%;
                opacity: 1;
            }
        }


        #main-content {
            display: none;
        }




        .product {
            margin: 20px;
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        #welcomeText {
            color: rgb(4 4 4 / 80%);
            background-color: #5656579c;
        }

        .product-container {
            margin-left: 25%;
            margin-top: 50px;
            padding: 20px;
            width: 50%;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

            .product-container:hover {
                transform: scale(1.02);
            }


            .product-container button {
                padding: 10px 20px;
                font-size: 16px;
                color: white;
                background-color: #28a745;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

                .product-container button:hover {
                    background-color: #218838;
                }

            .product-container p {
                margin-top: 25px;
                font-size: 24px;
                color: rgb(4 4 4 / 80%);
                background-color: #5656579c;
            }


        #cartCount {
            font-weight: bold;
            color: rgb(4 4 4 / 80%);
        }
    </style>
</head>
