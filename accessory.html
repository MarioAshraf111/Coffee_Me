    <title></title>
    <style>
        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            justify-content: center;
            padding: 20px;
            margin-left: 270px;
        }

            .image-container figure {
                text-align: center;
                width: 200px;
            }

                .image-container figure:hover {
                    transform: scale(1.05);
                    box-shadow: 0 6px 10px rgba(73 37 27 / 80%);
                }

            .image-container img {
                width: 100%;
                height: auto;
            }

            .image-container figcaption {
                margin-top: 5px;
                font-size: 14px;
                color: rgba(255, 255, 255, 0.9);
                background-color: rgba(73 37 27 / 80%);
                border-radius: 5px;
                padding: 10px;
            }

        figcaption:hover {
            background-color: rgba(132 74 53 / 90%);
        }

        .image-container figure button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #1a1919;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        body {
            background-image: url('access/WhatsApp Image 2024-12-06 at 16.32.40_871dbfe7.jpg');
            background-position: center;
            background-attachment: fixed;
        }

        .sidebar {
            width: 250px;
            background-color: rgba(45 29 24 / 90%);
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(69, 158, 176, 0.1);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #coffee_me {
            font-family: allura;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            margin: 15px 0;
            padding: 10px;
            background-color: rgba(73 37 27 / 80%);
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

            .sidebar a:hover {
                background-color: rgb(85 57 49 / 80%);
            }

            .sidebar a.selected {
                background-color: rgba(59 22 11);
                color: rgba(255, 255, 255, 0.9);
                font-weight: bold;
                border-bottom: 3px solid rgba(255, 255, 255, 0.8);
            }
    </style>
    <style>

        #welcomeText {
            font-size: 24px;
            text-align: center;
            color: rgb(4 4 4 / 80%);
            margin: 50px auto;
            overflow: hidden;
            white-space: nowrap;
            animation: slideText 5s linear forwards;
        }


        @keyframes slideText {
            0% {
                width: 0;
                opacity: 1;
            }

            100% {
                width: 100%;
                opacity: 1;
            }
        }


        #main-content {
            display: none;
        }




        .product {
            margin: 20px;
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        #welcomeText {
            color: white;
            background-color: #5656579c;
        }

        .product-container {
            margin-left: 25%;
            margin-top: 50px;
            padding: 20px;
            width: 50%;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

            .product-container:hover {
                transform: scale(1.02);
            }


            .product-container button {
                padding: 10px 20px;
                font-size: 16px;
                color: white;
                background-color: #28a745;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

                .product-container button:hover {
                    background-color: #218838;
                }

            .product-container p {
                margin-top: 25px;
                font-size: 24px;
                color: white;
                background-color: #5656579c;
               
            }


        #cartCount {
            font-weight: bold;
            color:white;

    </style>
